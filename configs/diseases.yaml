_metadata:
  description: Consolidated disease database with diagnostic criteria, likelihood
    ratios, and prevalence
  version: '1.0'
  last_updated: '2025-01-29'
  sources:
    disease_criteria: disease_database.yaml
    likelihood_ratios: lr_store_evidence_based.json
    prevalence: priors_data.yaml
    exclusions: exclusions.yaml
  lr_sources:
    pneumonia:
    - Ebell et al. 2020 - Accuracy of Signs and Symptoms for CAP (Academic Emergency
      Medicine)
    - PMC6527561 - Clinical features for diagnosis of pneumonia (Scientific Reports
      2019)
    meningitis:
    - PMC5827054 - Accuracy of meningeal signs in early detection of meningitis
    - PMC6732499 - Sensitivity and specificity of meningeal signs
    - PMC3548367 - Appraisal of Kernig's and Brudzinski's sign
    appendicitis:
    - Alvarado Score meta-analysis - 19 studies, >4700 patients
    - ScienceDirect - Diagnostic accuracy of Alvarado score components
    uti:
    - 'PMC2883276 - The Diagnosis of UTI: A Systematic Review'
    - JAMA 2002 - Does this woman have an acute uncomplicated UTI?
    pulmonary_embolism:
    - PIOPED Study data
    - Wells Criteria validation studies
    - 'PMC5940642 - Acute PE: Focus on Clinical Picture'
diseases:
  PNEUMONIA:
    full_name: Pneumonia
    diagnostic_criteria:
      mandatory_features:
      - sym_cough
      - imaging_xray_positive_for_pneumonia
      negative_features:
      - imaging_xray_normal
    recommended_tests:
    - test_id: imaging_xray_chest
      display_name: Chest X-ray
      category: Imaging
      priority: 1
    - test_id: lab_cbc_wbc
      display_name: Blood Test (CBC for White Blood Cells)
      category: Blood Work
      priority: 2
    - test_id: physical_exam_crackles
      display_name: Physical Exam (Auscultation)
      category: Physical Exam
      priority: 2
    likelihood_ratios:
      fever: 2.5
      sym_cough: 2.0
      sym_shortness_of_breath: 2.0
      sym_chest_pain: 1.5
      pleuritic_pain: 2.0
      tachycardia: 2.8
      tachypnea: 3.5
      crackles: 2.4
      egophony: 6.2
      dullness_percussion: 2.6
      hemoptysis: 1.5
      runny_nose: 0.7
      neutrophilia: 3.0
      wbc_high: 2.5
      productive_cough: 2.5
      respiratory_rate_gte_20: 3.5
    prevalence:
      default:
        0-4: 1000
        5-17: 500
        18-29: 300
        30-44: 400
        45-64: 600
        65+: 1000
